<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أداة توليد رموز التفعيل - نظام كمسيون أسواق الهال</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    .header {
      background: #0f172a;
      padding: 20px 24px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .badge-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .title h1 {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }
    .title p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .field label {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 12px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
      direction: ltr;
      text-align: center;
      letter-spacing: 1px;
    }
    input:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      justify-content: center;
      margin-top: 8px;
      border-radius: 10px;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
    }
    .result-box {
      background: #09131f;
      border: 2px dashed #10b981;
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
      display: none;
    }
    .result-box.active {
      display: block;
    }
    .result-title {
      font-size: 12px;
      font-weight: 700;
      color: #34d399;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .key-display {
      background: #020617;
      border: 1px solid #1e293b;
      padding: 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 18px;
      font-weight: 900;
      color: #34d399;
      text-align: center;
      direction: ltr;
      letter-spacing: 2px;
      margin-bottom: 12px;
      user-select: all;
    }
    .btn-copy-result {
      width: 100%;
      background: #10b981;
      color: #020617;
      font-weight: 800;
      justify-content: center;
      padding: 12px;
    }
    .btn-copy-result:hover {
      background: #34d399;
    }
    .footer {
      background: #0f172a;
      padding: 14px 24px;
      border-top: 1px solid #334155;
      font-size: 11px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #020617;
      font-weight: 800;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="badge-icon">🔑</div>
      <div class="title">
        <h1>أداة توليد رموز التفعيل (لوحة الإدارة والموزع)</h1>
        <p>نظام توليد تراخيص مدى الحياة لبرنامج كمسيون إدارة أسواق الهال</p>
      </div>
    </div>

    <div class="body">
      <!-- Machine Code Input -->
      <div class="field">
        <label>كود الجهاز الفريد (Machine Hardware Code):</label>
        <div class="input-group">
          <input 
            type="text" 
            id="machineIdInput" 
            placeholder="مثال: KM-7482-9915-3841"
            autocomplete="off" 
            spellcheck="false"
          />
          <button type="button" class="btn btn-secondary" onclick="pasteMachineCode()">
            📋 لصق
          </button>
        </div>
      </div>

      <div class="alert alert-error" id="errorAlert"></div>

      <!-- Generate Button -->
      <button type="button" class="btn btn-primary" onclick="generateKey()">
        ⚡ توليد رمز التفعيل مدى الحياة (Lifetime Key)
      </button>

      <!-- Result Container -->
      <div class="result-box" id="resultBox">
        <div class="result-title">
          <span>✅ تم توليد رمز التفعيل الدائم بنجاح:</span>
          <span>نوع الترخيص: مدى الحياة</span>
        </div>
        <div class="key-display" id="generatedKeyDisplay">ACT-XXXX-XXXX-XXXX</div>
        <button type="button" class="btn btn-copy-result" onclick="copyGeneratedKey()">
          📄 نسخ رمز التفعيل لإرساله للعميل
        </button>
      </div>
    </div>

    <div class="footer">
      <span>أداة خارجية مستقلة للإدارة</span>
      <span>التشفير: Deterministic Dual-Seed Hash Engine</span>
    </div>
  </div>

  <div class="toast" id="toastMsg">تم النسخ إلى الحافظة بنجاح!</div>

  <script>
    const MASTER_SALT = 'COMMISSION_AL_HAL_HALAB_SYRIA_2026_SECURE_SALT_9941';

    function cyrb53(str, seed = 0) {
      let h1 = 0xdeadbeef ^ seed;
      let h2 = 0x41c6ce57 ^ seed;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return 4294967296 * (2097151 & h2) + (h1 >>> 0);
    }

    function formatCodeChunk(num, length = 4) {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let res = '';
      let n = Math.abs(num);
      for (let i = 0; i < length; i++) {
        res = chars[n % chars.length] + res;
        n = Math.floor(n / chars.length) + (i * 7);
      }
      return res;
    }

    function cleanCode(code) {
      return (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    function computeKey(machineId) {
      const cleanId = cleanCode(machineId);
      if (!cleanId) return '';

      const input1 = `${cleanId}:${MASTER_SALT}:lifetime:P1`;
      const input2 = `${cleanId}:${MASTER_SALT}:lifetime:P2`;
      const input3 = `${cleanId}:${MASTER_SALT}:lifetime:P3`;

      const h1 = cyrb53(input1, 101);
      const h2 = cyrb53(input2, 202);
      const h3 = cyrb53(input3, 303);

      const chunk1 = formatCodeChunk(h1, 4);
      const chunk2 = formatCodeChunk(h2, 4);
      const chunk3 = formatCodeChunk(h3, 4);

      return `ACT-${chunk1}-${chunk2}-${chunk3}`.toUpperCase();
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2500);
    }

    async function pasteMachineCode() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('machineIdInput').value = text.trim().toUpperCase();
          document.getElementById('errorAlert').style.display = 'none';
        }
      } catch (err) {
        alert('يرجى السماح بالوصول إلى الحافظة أو لصق الكود يدوياً (Ctrl+V)');
      }
    }

    function generateKey() {
      const input = document.getElementById('machineIdInput').value.trim();
      const errorAlert = document.getElementById('errorAlert');
      const resultBox = document.getElementById('resultBox');
      const keyDisplay = document.getElementById('generatedKeyDisplay');

      errorAlert.style.display = 'none';
      resultBox.classList.remove('active');

      if (!input) {
        errorAlert.innerText = 'يرجى إدخال أو لصق كود الجهاز أولاً';
        errorAlert.style.display = 'block';
        return;
      }

      const key = computeKey(input);
      if (!key) {
        errorAlert.innerText = 'كود الجهاز غير صالح، تأكد من نسخه بشكل كامل';
        errorAlert.style.display = 'block';
        return;
      }

      keyDisplay.innerText = key;
      resultBox.classList.add('active');
    }

    function copyGeneratedKey() {
      const key = document.getElementById('generatedKeyDisplay').innerText;
      if (!key) return;
      navigator.clipboard.writeText(key).then(() => {
        showToast('تم نسخ رمز التفعيل بنجاح! أرسله للعميل.');
      });
    }
  </script>
</body>
</html>
