<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Subtle glow / emblem backplate -->
  <circle cx="256" cy="256" r="190" fill="url(#primaryGrad)" opacity="0.08"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Main Financial / Scale Graphic -->
  <g filter="url(#shadow)">
    <!-- Scale Central Pillar -->
    <path d="M256 120 L256 360" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round"/>
    <!-- Pillar Base -->
    <path d="M190 380 L322 380" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M220 365 L292 365" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Pillar Crown & Jewel -->
    <circle cx="256" cy="116" r="16" fill="url(#goldGrad)"/>
    <circle cx="256" cy="116" r="8" fill="#ffffff" opacity="0.8"/>

    <!-- Scale Horizontal Beam -->
    <path d="M140 165 C 210 145, 302 145, 372 165" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Left Pan (Buyer / Debit / Balance) -->
    <path d="M140 172 L110 248" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M140 172 L170 248" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <!-- Left Dish -->
    <path d="M96 250 C 96 280, 184 280, 184 250 Z" fill="url(#primaryGrad)"/>
    <!-- Coins on Left Pan -->
    <circle cx="132" cy="238" r="12" fill="url(#goldGrad)"/>
    <circle cx="148" cy="242" r="10" fill="url(#goldGrad)"/>

    <!-- Right Pan (Seller / Credit / Profit) -->
    <path d="M372 172 L342 238" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M372 172 L402 238" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <!-- Right Dish -->
    <path d="M328 240 C 328 270, 416 270, 416 240 Z" fill="url(#accentGrad)"/>
    <!-- Coins on Right Pan -->
    <circle cx="364" cy="226" r="12" fill="url(#goldGrad)"/>
    <circle cx="380" cy="232" r="10" fill="url(#goldGrad)"/>
  </g>

  <!-- Financial Document / Commission Ribbon Badge at Bottom-Center -->
  <g filter="url(#shadow)">
    <rect x="186" y="300" width="140" height="42" rx="10" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="3"/>
    <text x="256" y="327" font-family="'Cairo', sans-serif" font-weight="900" font-size="20" fill="#f8fafc" text-anchor="middle">كمسيون</text>
  </g>
</svg>
